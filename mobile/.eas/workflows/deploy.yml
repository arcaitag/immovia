# Läuft bei jedem Push auf main, der die App betrifft (Expo-Projekt mit GitHub verbunden,
# Base Directory «mobile»). Änderungen nur an der Website lösen nichts aus.
#
# Zwei Wege laufen nebeneinander, damit nur einmal auf einen freien Rechner gewartet wird:
# - «Update veröffentlichen» stellt den App-Code bereit; die installierte App lädt ihn beim Öffnen.
# - Hat sich etwas Natives geändert (Expo-Version, Icon, Berechtigungen, neue native Pakete),
#   findet «Passenden iOS-Build suchen» keinen Build; dann wird eine neue App gebaut und an
#   TestFlight gesendet. Das Update von oben gilt dann erst für diese neue App.
name: App veröffentlichen

on:
  push:
    branches: ['main']
    paths:
      - mobile/**

# Ein neuer Push ersetzt einen noch wartenden Lauf – es zählt nur der neueste Stand.
concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: true

jobs:
  publish_ios_update:
    name: Update veröffentlichen
    type: update
    params:
      branch: production
      platform: ios
  fingerprint:
    name: Native Änderungen erkennen
    type: fingerprint
    environment: production
  get_ios_build:
    name: Passenden iOS-Build suchen
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production
  build_ios:
    name: iOS-App bauen
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production
  submit_ios_build:
    name: An TestFlight senden
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
